<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>🔒 Vault by Farman — End-to-End Encrypted 1-on-1 Messenger</title>
  <meta name="description" content="Vault by Farman — End-to-end encrypted 1-on-1 messenger by @username with persistent Chat Theme bubble gradients, per-chat Seen control, permanent Blue Tick verification (22/7), and Pink Mode." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Outfit', 'sans-serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
  </script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .vault-btn {
      transition: transform 140ms cubic-bezier(0.16, 1, 0.3, 1), opacity 140ms ease, background-color 150ms ease;
    }
    .vault-btn:hover:not(:disabled) { transform: translateY(-1px); }
    .vault-btn:active:not(:disabled) { transform: scale(0.96); }
    @keyframes peekPopIn {
      0% { opacity: 0; transform: translateY(10px) scale(0.85); }
      70% { opacity: 1; transform: translateY(-2px) scale(1.04); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .vault-peek-head {
      animation: peekPopIn 280ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.28); border-radius: 9999px; }
  </style>
</head>
<body class="h-[100dvh] w-full overflow-hidden">
  <div id="app" class="h-full w-full flex flex-col overflow-hidden"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js';
    import {
      getAuth,
      GoogleAuthProvider,
      onAuthStateChanged,
      signInWithPopup,
      signOut
    } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js';
    import {
      getFirestore,
      collection,
      doc,
      getDoc,
      getDocs,
      setDoc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      query,
      where,
      serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js';

    // =========================================================================
    // 1. FIREBASE CONFIGURATION (Vault by Farman)
    // =========================================================================
    const firebaseConfig = {
      projectId: "direct-bivouac-s07pf",
      appId: "1:1004274449142:web:a1c433d1c869532d254ad7",
      apiKey: "AIzaSyCUD3Lk0IQd0VSxHloJaHjkLBjQVJmSY80",
      authDomain: "direct-bivouac-s07pf.firebaseapp.com",
      firestoreDatabaseId: "ai-studio-4f6b378b-161e-40b7-9ea6-245eb4b21927",
      storageBucket: "direct-bivouac-s07pf.firebasestorage.app",
      messagingSenderId: "1004274449142"
    };

    const firebaseApp = initializeApp(firebaseConfig);
    const auth = getAuth(firebaseApp);
    const db = getFirestore(firebaseApp, firebaseConfig.firestoreDatabaseId);
    const googleProvider = new GoogleAuthProvider();
    googleProvider.setCustomParameters({ prompt: 'select_account' });

    // =========================================================================
    // 2. CONSTANTS, AVATARS & CHAT BUBBLE GRADIENT THEMES
    // =========================================================================
    const CHAT_BUBBLE_GRADIENT_THEMES = [
      {
        id: 'default',
        label: 'App Default',
        swatchClass: 'bg-gradient-to-br from-zinc-900 via-zinc-700 to-zinc-400',
        bubbleClass: ''
      },
      {
        id: 'insta',
        label: 'Insta Sunset',
        swatchClass: 'bg-gradient-to-r from-purple-600 via-pink-500 to-orange-400',
        bubbleClass: 'bg-gradient-to-r from-purple-600 via-pink-500 to-orange-400 text-white border-transparent shadow-sm'
      },
      {
        id: 'ocean',
        label: 'Ocean Breeze',
        swatchClass: 'bg-gradient-to-r from-cyan-500 via-blue-500 to-indigo-600',
        bubbleClass: 'bg-gradient-to-r from-cyan-500 via-blue-500 to-indigo-600 text-white border-transparent shadow-sm'
      },
      {
        id: 'aurora',
        label: 'Emerald Aurora',
        swatchClass: 'bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-600',
        bubbleClass: 'bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-600 text-white border-transparent shadow-sm'
      },
      {
        id: 'berry',
        label: 'Velvet Berry',
        swatchClass: 'bg-gradient-to-r from-fuchsia-600 via-rose-500 to-pink-500',
        bubbleClass: 'bg-gradient-to-r from-fuchsia-600 via-rose-500 to-pink-500 text-white border-transparent shadow-sm'
      },
      {
        id: 'cosmic',
        label: 'Cosmic Violet',
        swatchClass: 'bg-gradient-to-r from-indigo-600 via-purple-600 to-violet-500',
        bubbleClass: 'bg-gradient-to-r from-indigo-600 via-purple-600 to-violet-500 text-white border-transparent shadow-sm'
      },
      {
        id: 'sunset',
        label: 'Golden Peach',
        swatchClass: 'bg-gradient-to-r from-amber-500 via-orange-500 to-rose-500',
        bubbleClass: 'bg-gradient-to-r from-amber-500 via-orange-500 to-rose-500 text-white border-transparent shadow-sm'
      },
      {
        id: 'obsidian',
        label: 'Stealth Carbon',
        swatchClass: 'bg-gradient-to-r from-zinc-800 via-neutral-900 to-black',
        bubbleClass: 'bg-gradient-to-r from-zinc-800 via-neutral-900 to-black text-white border-zinc-700 shadow-sm'
      }
    ];

    const DEFAULT_AVATAR = `data:image/svg+xml;utf8,${encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" rx="60" fill="#18181B"/><circle cx="60" cy="45" r="20" fill="#FAFAFA"/><path d="M26 102c6-19 21-29 34-29s28 10 34 29" fill="#FAFAFA"/></svg>`
    )}`;

    // =========================================================================
    // 3. SANITIZERS & HELPERS
    // =========================================================================
    const clamp = (val, max) => String(val || '').slice(0, max);
    const sanitizeId = (raw, fb = 'id_default') => {
      const c = String(raw || '').replace(/[^a-zA-Z0-9_\-]/g, '').slice(0, 128);
      return c.length >= 1 ? c : fb;
    };
    const sanitizeHandle = (raw) => {
      const c = String(raw || '').toLowerCase().replace(/[^a-z0-9_\-]/g, '').slice(0, 32);
      return c.length >= 2 ? c : 'user_' + Math.random().toString(36).slice(2, 6);
    };
    const normalizeUsername = (raw) => {
      const c = String(raw || '').trim().replace(/^@+/, '').toLowerCase().replace(/[^a-z0-9_\-]/g, '').slice(0, 32);
      return c.length >= 2 ? c : '';
    };
    const sanitizeName = (raw) => {
      const t = String(raw || '').trim().slice(0, 48);
      return t.length >= 1 ? t : 'Vault User';
    };
    const getDirectPairRoomId = (uidA, uidB) => {
      const [first, second] = [sanitizeId(uidA), sanitizeId(uidB)].sort();
      return `dm_${first.slice(0, 24)}_${second.slice(0, 24)}`;
    };
    const escapeHtml = (str) =>
      String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');

    const blueTickSvg = (sizeClass = 'w-4 h-4') => `
      <svg viewBox="0 0 40 40" fill="none" class="${sizeClass} inline-block shrink-0" title="Verified by Farman (22/7)">
        <path d="M19.998 3.094 14.638 0l-2.972 5.15H5.432v6.354L0 14.64 3.094 20 0 25.359l5.432 3.137v5.905h5.975L14.638 40l5.36-3.094L25.358 40l3.232-5.6h6.162v-6.01L40 25.359 36.905 20 40 14.641l-5.248-3.03v-6.46h-6.419L25.358 0l-5.36 3.094Zm7.415 11.225 2.254 2.287-11.43 11.5-6.835-6.93 2.244-2.258 4.587 4.581 9.18-9.18Z" fill="#0095F6"/>
      </svg>
    `;

    const formatTime = (ts) => {
      if (!ts || typeof ts.toDate !== 'function') {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      }
      return ts.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    };

    const formatOfflineStatus = (status, updatedAt) => {
      if (status === 'online') return 'Online';
      if (status === 'focus') return 'Focus';
      if (!updatedAt || typeof updatedAt.toMillis !== 'function') return 'Offline';
      const diffMin = Math.floor(Math.max(0, Date.now() - updatedAt.toMillis()) / 60000);
      if (diffMin < 1) return 'Offline · just now';
      if (diffMin < 60) return `Offline · ${diffMin}min last`;
      const diffHr = Math.floor(diffMin / 60);
      if (diffHr < 24) return `Offline · ${diffHr}h last`;
      return `Offline · ${Math.floor(diffHr / 24)}d last`;
    };

    // =========================================================================
    // 4. APPLICATION STATE
    // =========================================================================
    const state = {
      isDark: localStorage.getItem('vault_theme_dark') === 'true',
      isPink: localStorage.getItem('vault_theme_pink') === 'true',
      authReady: false,
      currentUser: null,
      profile: null,
      activeSection: 'messages', // 'messages' | 'pair' | 'profile'
      selectedRoomId: '',
      showChatThemeMenu: false,
      showVerifyModal: false,
      verifyFeedback: '',
      creatorRooms: {},
      partnerRooms: {},
      sentMessages: {},
      receivedMessages: {},
      localPins: {},
      localRoomThemes: {},
      disabledSeenByRoom: {},
      searchFeedback: '',
      foundUser: null,
      demoBubbleTheme: 'insta',
      demoSeenEnabled: true,
      demoMessages: [
        { id: 'd1', sender: 'partner', text: 'Hey! Search my @farman username to start a private 1-on-1 encrypted chat 🔒', time: '14:20' },
        { id: 'd2', sender: 'me', text: 'Love the new Chat Theme gradients! Switched our room to Insta Sunset ✨', time: '14:21' }
      ]
    };

    let unsubProfile = null;
    let unsubCreatorRooms = null;
    let unsubPartnerRooms = null;
    let unsubSentMsgs = null;
    let unsubRecMsgs = null;
    let subscribedMsgRoomId = '';

    // =========================================================================
    // 5. REAL-TIME LISTENERS & FIRESTORE SYNC
    // =========================================================================
    onAuthStateChanged(auth, async (user) => {
      state.currentUser = user;
      state.authReady = true;
      if (!user) {
        state.profile = null;
        state.creatorRooms = {};
        state.partnerRooms = {};
        state.sentMessages = {};
        state.receivedMessages = {};
        state.selectedRoomId = '';
        renderApp();
        return;
      }

      try {
        state.localPins = JSON.parse(localStorage.getItem(`vault_pins_${user.uid}`) || '{}');
        state.localRoomThemes = JSON.parse(localStorage.getItem(`vault_room_themes_${user.uid}`) || '{}');
        state.disabledSeenByRoom = JSON.parse(localStorage.getItem(`vault_disabled_seen_${user.uid}`) || '{}');
      } catch {}

      const userRef = doc(db, 'users', user.uid);
      const snap = await getDoc(userRef);
      const cachedVerified = localStorage.getItem(`vault_verified_${user.uid}`) === 'true';

      if (!snap.exists()) {
        const displayName = sanitizeName(user.displayName || user.email?.split('@')[0]);
        let handle = sanitizeHandle(user.email?.split('@')[0] || user.displayName);
        const hSnap = await getDoc(doc(db, 'usernames', handle));
        if (hSnap.exists() && hSnap.data()?.uid !== user.uid) {
          handle = sanitizeHandle(`${handle}_${user.uid.slice(0, 4)}`);
        }
        const avatarData = user.photoURL && user.photoURL.length < 2000 ? user.photoURL : DEFAULT_AVATAR;
        await setDoc(userRef, {
          uid: user.uid,
          displayName,
          handle,
          bio: '🔒 End-to-End Encrypted · Vault by Farman',
          statusState: 'online',
          avatarData,
          peekEmoji: '😎',
          ...(cachedVerified ? { isVerified: true, verificationAnswer: '22/7' } : {}),
          pushEnabled: true,
          readReceiptsEnabled: true,
          activeRoomId: '',
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });
        await setDoc(doc(db, 'usernames', handle), {
          handle,
          uid: user.uid,
          displayName,
          bio: '🔒 End-to-End Encrypted · Vault by Farman',
          statusState: 'online',
          avatarData,
          peekEmoji: '😎',
          ...(cachedVerified ? { isVerified: true, verificationAnswer: '22/7' } : {}),
          updatedAt: serverTimestamp()
        });
      }

      if (unsubProfile) unsubProfile();
      unsubProfile = onSnapshot(userRef, (d) => {
        if (d.exists()) {
          state.profile = d.data();
          renderApp();
        }
      });

      const roomsCol = collection(db, 'rooms');
      if (unsubCreatorRooms) unsubCreatorRooms();
      if (unsubPartnerRooms) unsubPartnerRooms();

      unsubCreatorRooms = onSnapshot(query(roomsCol, where('creatorId', '==', user.uid)), (s) => {
        const next = {};
        s.forEach((docItem) => { next[docItem.id] = docItem.data(); });
        state.creatorRooms = next;
        syncActiveRoomListeners();
        renderApp();
      });

      unsubPartnerRooms = onSnapshot(query(roomsCol, where('partnerId', '==', user.uid)), (s) => {
        const next = {};
        s.forEach((docItem) => { next[docItem.id] = docItem.data(); });
        state.partnerRooms = next;
        syncActiveRoomListeners();
        renderApp();
      });
    });

    function getSortedRooms() {
      const merged = { ...state.creatorRooms, ...state.partnerRooms };
      return Object.values(merged)
        .filter((r) => r.roomType !== 'group' && r.status !== 'archived' && r.partnerId !== 'OPEN')
        .sort((a, b) => {
          const pinA = isPinned(a) ? 1 : 0;
          const pinB = isPinned(b) ? 1 : 0;
          if (pinA !== pinB) return pinB - pinA;
          const tA = a.updatedAt?.toMillis?.() || 0;
          const tB = b.updatedAt?.toMillis?.() || 0;
          return tB - tA;
        });
    }

    function isPinned(room) {
      if (room.roomId in state.localPins) return Boolean(state.localPins[room.roomId]);
      if (!state.currentUser) return false;
      return room.creatorId === state.currentUser.uid ? Boolean(room.creatorPinned) : Boolean(room.partnerPinned);
    }

    function getActiveRoom() {
      const rooms = getSortedRooms();
      if (!state.selectedRoomId && rooms.length > 0) {
        state.selectedRoomId = rooms[0].roomId;
      }
      return rooms.find((r) => r.roomId === state.selectedRoomId) || rooms[0] || null;
    }

    function syncActiveRoomListeners() {
      const activeRoom = getActiveRoom();
      if (!state.currentUser || !activeRoom || activeRoom.status !== 'active') {
        if (unsubSentMsgs) { unsubSentMsgs(); unsubSentMsgs = null; }
        if (unsubRecMsgs) { unsubRecMsgs(); unsubRecMsgs = null; }
        subscribedMsgRoomId = '';
        state.sentMessages = {};
        state.receivedMessages = {};
        return;
      }

      if (subscribedMsgRoomId === activeRoom.roomId) return;
      subscribedMsgRoomId = activeRoom.roomId;

      if (unsubSentMsgs) unsubSentMsgs();
      if (unsubRecMsgs) unsubRecMsgs();

      const msgsCol = collection(db, 'rooms', activeRoom.roomId, 'messages');
      unsubSentMsgs = onSnapshot(query(msgsCol, where('senderId', '==', state.currentUser.uid)), (s) => {
        const next = {};
        s.forEach((d) => { next[d.id] = d.data(); });
        state.sentMessages = next;
        renderApp();
      });

      unsubRecMsgs = onSnapshot(query(msgsCol, where('recipientId', '==', state.currentUser.uid)), (s) => {
        const next = {};
        s.forEach((d) => { next[d.id] = d.data(); });
        state.receivedMessages = next;
        markIncomingMessagesSeen(activeRoom);
        renderApp();
      });
    }

    function markIncomingMessagesSeen(activeRoom) {
      if (
        !state.currentUser ||
        !activeRoom ||
        activeRoom.status !== 'active' ||
        state.activeSection !== 'messages' ||
        state.profile?.readReceiptsEnabled === false ||
        state.disabledSeenByRoom[activeRoom.roomId]
      ) {
        return;
      }
      const clock = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      Object.values(state.receivedMessages).forEach((m) => {
        if (m.senderId !== state.currentUser.uid && m.deliveryStatus !== 'read') {
          updateDoc(doc(db, 'rooms', activeRoom.roomId, 'messages', m.messageId), {
            deliveryStatus: 'read',
            readAtText: clock,
            updatedAt: serverTimestamp()
          }).catch(() => {});
        }
      });
    }

    function getPartnerDisplay(room) {
      if (!state.currentUser || !room) {
        return { uid: '', name: 'Partner', handle: 'user', bio: '', status: 'online', statusLabel: 'Online', avatar: DEFAULT_AVATAR, isVerified: false };
      }
      const isCreator = room.creatorId === state.currentUser.uid;
      const otherUid = isCreator ? room.partnerId : room.creatorId;
      const status = isCreator ? room.partnerStatus : room.creatorStatus;
      return {
        uid: otherUid,
        name: isCreator ? room.partnerName : room.creatorName,
        handle: isCreator ? room.partnerHandle : room.creatorHandle,
        bio: isCreator ? room.partnerBio : room.creatorBio,
        status,
        statusLabel: formatOfflineStatus(status, room.updatedAt),
        avatar: (isCreator ? room.partnerAvatar : room.creatorAvatar) || DEFAULT_AVATAR,
        isVerified: Boolean(isCreator ? room.partnerVerified : room.creatorVerified)
      };
    }

    // =========================================================================
    // 6. GLOBAL WINDOW ACTIONS FOR INLINE EVENT HANDLERS
    // =========================================================================
    window.vaultActions = {
      toggleDark() {
        state.isDark = !state.isDark;
        localStorage.setItem('vault_theme_dark', String(state.isDark));
        renderApp();
      },
      togglePink() {
        state.isPink = !state.isPink;
        localStorage.setItem('vault_theme_pink', String(state.isPink));
        renderApp();
      },
      setSection(sec) {
        state.activeSection = sec;
        renderApp();
      },
      selectRoom(roomId) {
        state.selectedRoomId = roomId;
        state.activeSection = 'messages';
        syncActiveRoomListeners();
        renderApp();
      },
      setDemoTheme(themeId) {
        state.demoBubbleTheme = themeId;
        renderApp();
      },
      toggleDemoSeen() {
        state.demoSeenEnabled = !state.demoSeenEnabled;
        renderApp();
      },
      sendDemoMessage(e) {
        e.preventDefault();
        const input = document.getElementById('demo-msg-input');
        if (!input || !input.value.trim()) return;
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
        state.demoMessages.push({ id: 'dm_' + Date.now(), sender: 'me', text: input.value.trim(), time });
        input.value = '';
        renderApp();
      },
      async signInGoogle() {
        try {
          await signInWithPopup(auth, googleProvider);
        } catch (err) {
          console.error('Google Sign-In error:', err);
        }
      },
      async signOutUser() {
        if (state.currentUser && state.profile) {
          await updateDoc(doc(db, 'users', state.currentUser.uid), {
            statusState: 'offline',
            activeRoomId: '',
            updatedAt: serverTimestamp()
          }).catch(() => {});
        }
        await signOut(auth);
      },
      toggleChatThemeMenu() {
        state.showChatThemeMenu = !state.showChatThemeMenu;
        renderApp();
      },
      async selectRoomBubbleTheme(themeId) {
        const room = getActiveRoom();
        if (!room || !state.currentUser) return;
        state.localRoomThemes[room.roomId] = themeId;
        localStorage.setItem(`vault_room_themes_${state.currentUser.uid}`, JSON.stringify(state.localRoomThemes));
        renderApp();
        if (room.status === 'active') {
          await updateDoc(doc(db, 'rooms', room.roomId), {
            bubbleTheme: clamp(themeId, 32),
            updatedAt: serverTimestamp()
          }).catch(() => {});
        }
      },
      toggleRoomSeen(roomId) {
        if (!state.currentUser || !roomId) return;
        state.disabledSeenByRoom[roomId] = !state.disabledSeenByRoom[roomId];
        localStorage.setItem(`vault_disabled_seen_${state.currentUser.uid}`, JSON.stringify(state.disabledSeenByRoom));
        const activeRoom = getActiveRoom();
        if (activeRoom && !state.disabledSeenByRoom[roomId]) {
          markIncomingMessagesSeen(activeRoom);
        }
        renderApp();
      },
      async togglePinRoom(roomId, ev) {
        if (ev) ev.stopPropagation();
        const rooms = getSortedRooms();
        const room = rooms.find((r) => r.roomId === roomId);
        if (!room || !state.currentUser) return;
        const nextPin = !isPinned(room);
        state.localPins[roomId] = nextPin;
        localStorage.setItem(`vault_pins_${state.currentUser.uid}`, JSON.stringify(state.localPins));
        renderApp();
        const isCreator = room.creatorId === state.currentUser.uid;
        await updateDoc(doc(db, 'rooms', roomId), {
          ...(isCreator ? { creatorPinned: nextPin } : { partnerPinned: nextPin }),
          updatedAt: serverTimestamp()
        }).catch(() => {});
      },
      async deleteRoom(roomId) {
        if (!state.currentUser || !roomId) return;
        const msgsCol = collection(db, 'rooms', roomId, 'messages');
        const [s1, s2] = await Promise.all([
          getDocs(query(msgsCol, where('senderId', '==', state.currentUser.uid))),
          getDocs(query(msgsCol, where('recipientId', '==', state.currentUser.uid)))
        ]);
        const dels = [];
        s1.forEach((d) => dels.push(deleteDoc(d.ref)));
        s2.forEach((d) => dels.push(deleteDoc(d.ref)));
        await Promise.all(dels);
        await deleteDoc(doc(db, 'rooms', roomId));
        if (state.selectedRoomId === roomId) state.selectedRoomId = '';
        renderApp();
      },
      async sendMessage(e) {
        e.preventDefault();
        const input = document.getElementById('chat-composer-input');
        const activeRoom = getActiveRoom();
        if (!input || !input.value.trim() || !activeRoom || !state.currentUser || !state.profile) return;
        const text = clamp(input.value.trim(), 2000);
        input.value = '';
        const msgId = sanitizeId(`msg_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`);
        const recipientId = activeRoom.creatorId === state.currentUser.uid ? activeRoom.partnerId : activeRoom.creatorId;

        await setDoc(doc(db, 'rooms', activeRoom.roomId, 'messages', msgId), {
          messageId: msgId,
          roomId: activeRoom.roomId,
          senderId: state.currentUser.uid,
          recipientId: sanitizeId(recipientId),
          memberIds: [activeRoom.creatorId, activeRoom.partnerId],
          senderName: sanitizeName(state.profile.displayName),
          senderAvatar: clamp(state.profile.avatarData || DEFAULT_AVATAR, 150000),
          text,
          mediaType: 'none',
          mediaData: '',
          mediaName: '',
          mediaSize: 0,
          replyToId: '',
          replyToPreview: '',
          reaction: '',
          deliveryStatus: 'sent',
          readAtText: '',
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });

        await updateDoc(doc(db, 'rooms', activeRoom.roomId), {
          typingUserId: '',
          typingUserName: '',
          lastMessageText: clamp(text, 160),
          lastMessageSenderId: state.currentUser.uid,
          updatedAt: serverTimestamp()
        });
      },
      async searchUsername(e) {
        e.preventDefault();
        const input = document.getElementById('search-username-input');
        if (!input || !state.currentUser || !state.profile) return;
        const clean = normalizeUsername(input.value);
        if (!clean) {
          state.searchFeedback = 'Invalid @username format.';
          state.foundUser = null;
          renderApp();
          return;
        }
        if (clean === state.profile.handle.toLowerCase()) {
          state.searchFeedback = 'That is your own @username.';
          state.foundUser = null;
          renderApp();
          return;
        }
        const snap = await getDoc(doc(db, 'usernames', clean));
        if (!snap.exists()) {
          state.searchFeedback = `Username @${clean} does not exist.`;
          state.foundUser = null;
        } else {
          state.foundUser = snap.data();
          state.searchFeedback = `Found @${state.foundUser.handle}!`;
        }
        renderApp();
      },
      async sendFriendRequest() {
        const target = state.foundUser;
        if (!target || !state.currentUser || !state.profile) return;
        const pairRoomId = getDirectPairRoomId(state.currentUser.uid, target.uid);
        await setDoc(doc(db, 'rooms', pairRoomId), {
          roomId: pairRoomId,
          roomName: sanitizeName(`${state.profile.displayName} & ${target.displayName}`),
          roomType: 'direct',
          memberIds: [state.currentUser.uid, target.uid],
          creatorId: state.currentUser.uid,
          creatorName: sanitizeName(state.profile.displayName),
          creatorHandle: sanitizeHandle(state.profile.handle),
          creatorBio: clamp(state.profile.bio, 160),
          creatorStatus: state.profile.statusState || 'online',
          creatorAvatar: clamp(state.profile.avatarData || DEFAULT_AVATAR, 150000),
          creatorVerified: Boolean(state.profile.isVerified),
          partnerId: sanitizeId(target.uid),
          partnerName: sanitizeName(target.displayName),
          partnerHandle: sanitizeHandle(target.handle),
          partnerBio: clamp(target.bio, 160),
          partnerStatus: target.statusState || 'online',
          partnerAvatar: clamp(target.avatarData || DEFAULT_AVATAR, 150000),
          partnerVerified: Boolean(target.isVerified),
          creatorPinned: false,
          partnerPinned: false,
          typingUserId: '',
          typingUserName: '',
          lastMessageText: `🔒 @${state.profile.handle} sent an encrypted chat request`,
          lastMessageSenderId: state.currentUser.uid,
          status: 'waiting',
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });
        state.selectedRoomId = pairRoomId;
        state.activeSection = 'messages';
        state.foundUser = null;
        renderApp();
      },
      async acceptRequest(roomId) {
        const rooms = getSortedRooms();
        const room = rooms.find((r) => r.roomId === roomId);
        if (!room || !state.currentUser || !state.profile) return;
        await updateDoc(doc(db, 'rooms', roomId), {
          partnerId: state.currentUser.uid,
          partnerName: sanitizeName(state.profile.displayName),
          partnerHandle: sanitizeHandle(state.profile.handle),
          partnerBio: clamp(state.profile.bio, 160),
          partnerStatus: state.profile.statusState || 'online',
          partnerAvatar: clamp(state.profile.avatarData || DEFAULT_AVATAR, 150000),
          partnerVerified: Boolean(state.profile.isVerified),
          memberIds: [room.creatorId, state.currentUser.uid],
          status: 'active',
          lastMessageText: `🔒 @${state.profile.handle} accepted the chat request!`,
          lastMessageSenderId: state.currentUser.uid,
          updatedAt: serverTimestamp()
        });
        state.selectedRoomId = roomId;
        state.activeSection = 'messages';
        syncActiveRoomListeners();
        renderApp();
      },
      openVerifyModal() {
        state.showVerifyModal = true;
        state.verifyFeedback = '';
        renderApp();
      },
      closeVerifyModal() {
        state.showVerifyModal = false;
        renderApp();
      },
      async submitVerifyAnswer(e) {
        e.preventDefault();
        const input = document.getElementById('verify-answer-input');
        if (!input || !state.currentUser || !state.profile) return;
        if (input.value.trim().replace(/\s+/g, '') !== '22/7') {
          state.verifyFeedback = 'Incorrect answer! Enter the secret answer to unlock your permanent Blue Tick.';
          renderApp();
          return;
        }
        await updateDoc(doc(db, 'users', state.currentUser.uid), {
          isVerified: true,
          verificationAnswer: '22/7',
          updatedAt: serverTimestamp()
        });
        await updateDoc(doc(db, 'usernames', state.profile.handle), {
          isVerified: true,
          verificationAnswer: '22/7',
          updatedAt: serverTimestamp()
        }).catch(() => {});
        localStorage.setItem(`vault_verified_${state.currentUser.uid}`, 'true');
        state.showVerifyModal = false;
        renderApp();
      }
    };

    // =========================================================================

                  ${state.foundUser ? `

                </div>
                <div class="border rounded-3xl p-6 space-y-3 ${bgCard} ${borderCol}">
                  <p class="text-sm font-bold">Instagram-Style Permanent Blue Tick</p>
                  <p class="text-xs ${textMuted}">

              <div class="flex-1 flex flex-col items-center justify-center p-8 text-center space-y-3">
                <p class="text-xl font-display font-bold">🔒 Vault by Farman</p>
                <p class="text-xs ${textMuted}">Select a chat or search a friend's <strong>@username</strong>.</p>

            ` : `
              <!-- Active 1-on-1 Conversation Header with Persistent Chat Theme Menu -->
              <div class="px-4 sm:px-6 py-3 border-b flex items-center justify-between gap-2 shrink-0 ${borderCol} ${bgMain}">
                <div>
                  <div class="flex items-center gap-1.5">
                    <h2 class="text-sm font-display font-bold">${escapeHtml(partner?.name)}</h2>
                    ${partner?.isVerified ? blueTickSvg('w-4 h-4') : ''}
                    <span class="text-xs font-mono ${textMuted}">@${escapeHtml(partner?.handle)}</span>

                  </div>
                  <div class="flex flex-wrap items-center gap-2">
                    ${CHAT_BUBBLE_GRADIENT_THEMES.map((t) => `
                      <button onclick="window.vaultActions.selectRoomBubbleTheme('${t.id}')" class="px-3 py-1.5 rounded-full text-xs font-semibold flex items-center gap-2 border cursor-pointer ${currentRoomThemeId === t.id ? btnPrimary : `${bgCard} ${borderCol}`}">
                        <span class="w-3.5 h-3.5 rounded-full border border-white/40 ${t.swatchClass}"></span>
                        <span>${t.label}</span>
                      </button>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              ${activeRoom.status === 'waiting' ? `
                <div class="flex-1 flex flex-col items-center justify-center p-6 text-center space-y-4">
                  <p class="text-base font-display font-bold">@${escapeHtml(partner?.handle)}</p>
                  ${activeRoom.partnerId === currentUser.uid ? `
                    <button onclick="window.vaultActions.acceptRequest('${activeRoom.roomId}')" class="px-6 py-2.5 rounded-full text-xs font-bold cursor-pointer ${btnPrimary}">
                      Accept Chat Request
                    </button>
                  ` : `
                    <p class="text-xs ${textMuted}">⏳ Waiting for @${escapeHtml(partner?.handle)} to accept your request...</p>
                  `}
                </div>
              ` : `
                <div class="flex-1 overflow-y-auto px-4 sm:px-6 py-4 space-y-3 min-h-0">
                  ${mergedMessages.map((msg) => {
                    const isMine = msg.senderId === currentUser.uid;
                    const bubbleCls = isMine
                      ? (activeThemeObj.bubbleClass || (isDark ? 'bg-white text-black border-white' : 'bg-black text-white border-black'))
                      : `${bgSubtle} ${borderCol}`;
                    return `
                      <div class="flex flex-col ${isMine ? 'items-end' : 'items-start'}">
                        <div class="max-w-[78%] rounded-2xl px-4 py-2.5 border text-sm ${bubbleCls}">
                          ${escapeHtml(msg.text)}
                        </div>
                        <div class="mt-1 px-1 text-[10px] font-mono ${textMuted}">
                          ${formatTime(msg.createdAt)} ${isMine ? `· ${msg.deliveryStatus === 'read' ? `✓✓ Seen ${escapeHtml(msg.readAtText || '')}` : '✓ Sent'}` : ''}
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>

                <form onsubmit="window.vaultActions.sendMessage(event)" class="px-4 sm:px-6 py-3 border-t flex items-center gap-2 shrink-0 ${borderCol} ${bgMain}">
                  <input id="chat-composer-input" type="text" placeholder="Message @${escapeHtml(partner?.handle || '')}..." class="flex-1 h-10 px-4 text-sm rounded-full border focus:outline-none ${bgSubtle} ${borderCol}" />
                  <button type="submit" class="h-10 px-5 rounded-full font-display font-bold text-xs cursor-pointer ${btnPrimary}">Send</button>
                </form>
              `}
            `}
          </main>
        </div>

        <!-- Blue Tick Secret Verification Modal -->
        ${state.showVerifyModal ? `
          <div class="fixed inset-0 z-50 bg-black/75 flex items-center justify-center p-4">
            <form onsubmit="window.vaultActions.submitVerifyAnswer(event)" class="max-w-md w-full rounded-3xl border p-6 space-y-4 ${bgCard} ${borderCol}">
              <div class="flex items-center justify-between">
                <h3 class="text-base font-display font-bold">Claim Permanent Verified Blue Tick</h3>
                <button type="button" onclick="window.vaultActions.closeVerifyModal()" class="text-xs font-bold">✕</button>
              </div>
              <p class="text-sm font-display font-bold">What is the famous fractional approximation of Pi (π) in mathematics?</p>
              <input id="verify-answer-input" type="text" placeholder="Enter secret answer..." required class="w-full px-4 py-3 text-sm font-mono rounded-2xl border ${bgSubtle} ${borderCol}" />
              ${state.verifyFeedback ? `<p class="text-xs text-red-500 font-semibold">${escapeHtml(state.verifyFeedback)}</p>` : ''}
              <button type="submit" class="w-full py-3 rounded-full text-xs font-bold cursor-pointer ${btnPrimary}">
                Submit & Claim Permanent Blue Tick
              </button>
            </form>
          </div>
        ` : ''}
      `;
    }

    renderApp();
  </script>
</body>
</html>
